<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babolo — Admin Console</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#0a0910; --bg-elev:#141223; --bg-elev-2:#1b1830;
    --border:#2a2645; --text:#f1f0f7; --text-dim:#9b97b8; --text-faint:#5f5c7a;
    --mauve-1:#a78bfa; --mauve-2:#7c3aed; --lime:#c6ff5e; --danger:#ff5f6d; --amber:#ffb020;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  #app{display:flex; min-height:100vh;}
  .sidebar{width:230px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column; gap:4px;}
  .sidebar-logo{display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px; padding:8px 10px 20px;}
  .sidebar-logo .badge{font-size:10px; background:var(--mauve-2); color:#fff; padding:2px 7px; border-radius:100px; margin-left:4px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:var(--text-dim); font-size:13.5px; font-weight:600; background:none; border:none; text-align:left; width:100%;}
  .nav-item.active{background:rgba(167,139,250,.12); color:var(--mauve-1);}
  .nav-item:hover:not(.active){background:rgba(255,255,255,.03);}

  .main{flex:1; padding:26px 30px; max-width:1200px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;}
  .topbar h1{font-size:22px; margin:0;}
  .topbar p{color:var(--text-dim); font-size:13px; margin:4px 0 0;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:26px;}
  .stat-card{background:var(--bg-elev); border:1px solid var(--border); border-radius:14px; padding:16px;}
  .stat-card .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600;}
  .stat-card .stat-value{font-family:'Space Grotesk'; font-size:24px; font-weight:700; margin-top:6px;}

  .card{background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px;}
  .card-title{font-size:14px; font-weight:700; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:10px; border-bottom:1px solid rgba(255,255,255,.03); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}

  .btn{border-radius:9px; padding:7px 12px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--bg-elev-2); color:var(--text);}
  .btn:hover{border-color:var(--mauve-1);}
  .btn-mauve{background:linear-gradient(100deg,var(--mauve-2),var(--mauve-1)); color:#fff; border:none;}
  .btn-danger{background:rgba(255,95,109,.12); color:var(--danger); border-color:rgba(255,95,109,.3);}
  .btn-sm{padding:5px 10px; font-size:11px;}
  .btn-row{display:flex; gap:6px;}

  .badge{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:100px; text-transform:uppercase;}
  .badge-free{background:var(--bg-elev-2); color:var(--text-dim);}
  .badge-premium{background:linear-gradient(100deg,var(--mauve-2),var(--mauve-1)); color:#fff;}
  .badge-pending{background:rgba(255,176,32,.12); color:var(--amber);}

  .input{background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; width:100%;}

  #login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);}
  .login-box{width:100%; max-width:340px; background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; padding:28px;}
  .login-box h1{font-size:19px; margin:0 0 4px;}
  .login-box p{color:var(--text-dim); font-size:12.5px; margin:0 0 18px;}
  .login-box form{display:flex; flex-direction:column; gap:10px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bg-elev-2); border:1px solid var(--border); padding:10px 18px; border-radius:100px; font-size:13px; font-weight:600; z-index:60; opacity:0; transition:opacity .2s;}
  .toast.show{opacity:1;}
  .empty-state{color:var(--text-faint); font-size:13px; padding:20px; text-align:center;}
  .hidden{display:none !important;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--border); padding:10px 8px;}
    .sidebar-logo{display:none;}
    .nav-item{width:auto; flex-shrink:0; white-space:nowrap; padding:8px 12px;}
    .main{padding:18px;}
    table{font-size:11.5px;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="app"></div>

<script>
const API_BASE = 'https://api.babolo.app';

const state = {
  token: null,
  route: 'overview',
  users: [],
  deposits: [],
  alerts: [],
  loading: false,
};

async function apiFetch(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  let body = null;
  try { body = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error(body?.error || `Erreur ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return body;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div id="login-screen">
      <div class="login-box">
        <h1>🐝 Babolo — Admin</h1>
        <p>Accès réservé aux comptes administrateurs.</p>
        <form id="login-form">
          <input class="input" type="email" id="login-email" placeholder="Email admin" required>
          <input class="input" type="password" id="login-pass" placeholder="Mot de passe" required>
          <button type="submit" class="btn btn-mauve" style="margin-top:6px;">Se connecter</button>
        </form>
      </div>
    </div>
  `;
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-pass').value;
    try {
      const data = await apiFetch('/api/v1/auth/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email, password }),
      });
      state.token = data.token;
      try {
        await apiFetch('/api/v1/admin/users?limit=1');
        render();
      } catch (err) {
        if (err.status === 403) {
          toast('Ce compte n\'est pas administrateur');
        } else {
          toast(`Erreur : ${err.message}`);
        }
        state.token = null;
      }
    } catch (err) {
      toast(`Connexion échouée : ${err.message}`);
    }
  };
}

function go(route){ state.route = route; render(); }

function renderShell(){
  return `
    <div id="app-shell" style="display:flex; width:100%;">
      <aside class="sidebar">
        <div class="sidebar-logo">🐝 Babolo <span class="badge">ADMIN</span></div>
        <button class="nav-item ${state.route==='overview'?'active':''}" data-route="overview">📊 Overview</button>
        <button class="nav-item ${state.route==='users'?'active':''}" data-route="users">👥 Utilisateurs</button>
        <button class="nav-item ${state.route==='deposits'?'active':''}" data-route="deposits">💳 Dépôts</button>
        <button class="nav-item ${state.route==='alerts'?'active':''}" data-route="alerts">🚨 Alertes</button>
      </aside>
      <main class="main" id="main-content"></main>
    </div>
  `;
}

async function renderOverview(){
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="topbar"><div><h1>Vue d'ensemble</h1><p>Chargement…</p></div></div>`;
  try {
    const [users, deposits, alerts] = await Promise.all([
      apiFetch('/api/v1/admin/users?limit=200'),
      apiFetch('/api/v1/admin/deposits?status=pending'),
      apiFetch('/api/v1/admin/alerts'),
    ]);
    state.users = users; state.deposits = deposits; state.alerts = alerts;
    const premiumCount = users.filter(u => u.tier === 'premium').length;
    el.innerHTML = `
      <div class="topbar"><div><h1>Vue d'ensemble</h1><p>État actuel de la plateforme, en direct.</p></div></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Utilisateurs</div><div class="stat-value">${users.length}</div></div>
        <div class="stat-card"><div class="stat-label">Comptes Premium</div><div class="stat-value">${premiumCount}</div></div>
        <div class="stat-card"><div class="stat-label">Dépôts en attente</div><div class="stat-value">${deposits.length}</div></div>
        <div class="stat-card"><div class="stat-label">Alertes non résolues</div><div class="stat-value">${alerts.length}</div></div>
      </div>
      <div class="card">
        <div class="card-title">⚠️ Ce panneau affiche des chiffres réels, pas des estimations</div>
        <p style="color:var(--text-dim); font-size:12.5px; margin:0;">Contrairement à un dashboard "démo", chaque nombre ci-dessus vient d'un vrai appel à ton backend. Pas de graphique de revenus/coûts IA pour l'instant — ces données ne sont pas encore trackées côté serveur, à construire si besoin plutôt que d'afficher des chiffres inventés.</p>
      </div>
    `;
  } catch (err) {
    el.innerHTML = `<div class="topbar"><h1>Vue d'ensemble</h1></div><div class="empty-state">Erreur de chargement : ${err.message}</div>`;
  }
}

async function renderUsers(){
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="topbar"><h1>Utilisateurs</h1></div><div class="empty-state">Chargement…</div>`;
  try {
    const users = await apiFetch('/api/v1/admin/users?limit=200');
    state.users = users;
    el.innerHTML = `
      <div class="topbar"><div><h1>Utilisateurs</h1><p>${users.length} compte(s)</p></div></div>
      <div class="card">
        <table>
          <thead><tr><th>Email</th><th>Nom</th><th>Plan</th><th>Wallet</th><th>TikTok</th><th>Actions</th></tr></thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td>${u.email}</td>
                <td>${u.display_name}</td>
                <td><span class="badge ${u.tier==='premium'?'badge-premium':'badge-free'}">${u.tier}</span></td>
                <td class="mono">${Number(u.balance_htg).toFixed(2)} HTG / $${Number(u.balance_usd).toFixed(2)}</td>
                <td>${u.tiktok_username ? `@${u.tiktok_username} (${u.tiktok_tier||'?'})` : '—'}</td>
                <td>
                  <div class="btn-row">
                    <button class="btn btn-sm btn-mauve" data-action="premium" data-id="${u.id}">Premium</button>
                    <button class="btn btn-sm" data-action="credit" data-id="${u.id}">Créditer</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${users.length===0 ? '<div class="empty-state">Aucun utilisateur.</div>' : ''}
      </div>
    `;
    el.querySelectorAll('[data-action="premium"]').forEach(btn => {
      btn.onclick = async () => {
        const days = prompt('Nombre de jours de Premium à offrir :', '30');
        if (!days) return;
        try {
          await apiFetch(`/api/v1/admin/users/${btn.dataset.id}/premium`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ days: parseInt(days, 10) }),
          });
          toast('Premium activé ✅');
          renderUsers();
        } catch (err) { toast(`Erreur : ${err.message}`); }
      };
    });
    el.querySelectorAll('[data-action="credit"]').forEach(btn => {
      btn.onclick = async () => {
        const currency = prompt('Devise (HTG ou USD) :', 'HTG');
        if (!currency) return;
        const amount = prompt(`Montant à créditer en ${currency.toUpperCase()} :`, '100');
        if (!amount) return;
        try {
          await apiFetch(`/api/v1/admin/wallet/${btn.dataset.id}/credit`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ currency: currency.toUpperCase(), amount: parseFloat(amount) }),
          });
          toast('Wallet crédité ✅');
          renderUsers();
        } catch (err) { toast(`Erreur : ${err.message}`); }
      };
    });
  } catch (err) {
    el.innerHTML = `<div class="topbar"><h1>Utilisateurs</h1></div><div class="empty-state">Erreur : ${err.message}</div>`;
  }
}

async function renderDeposits(){
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="topbar"><h1>Dépôts en attente</h1></div><div class="empty-state">Chargement…</div>`;
  try {
    const deposits = await apiFetch('/api/v1/admin/deposits?status=pending');
    state.deposits = deposits;
    el.innerHTML = `
      <div class="topbar"><div><h1>Dépôts en attente</h1><p>Natcash / MonCash — vérification manuelle</p></div></div>
      <div class="card">
        <table>
          <thead><tr><th>Utilisateur</th><th>Méthode</th><th>Montant</th><th>Émetteur</th><th>Preuve</th><th>Actions</th></tr></thead>
          <tbody>
            ${deposits.map(d => `
              <tr>
                <td>${d.user_email || '<i>orphelin</i>'}</td>
                <td><span class="badge badge-pending">${d.method}</span></td>
                <td class="mono">${d.amount_htg ? Number(d.amount_htg).toFixed(2)+' HTG' : '—'}</td>
                <td>${d.sender_number || '—'}</td>
                <td>${d.proof_path ? `<button class="btn btn-sm" data-action="view-proof" data-id="${d.id}">📎 Voir</button>` : '—'}</td>
                <td>
                  <div class="btn-row">
                    <button class="btn btn-sm btn-mauve" data-action="approve" data-id="${d.id}">Approuver</button>
                    <button class="btn btn-sm btn-danger" data-action="reject" data-id="${d.id}">Rejeter</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${deposits.length===0 ? '<div class="empty-state">Aucun dépôt en attente 🎉</div>' : ''}
      </div>
    `;
    el.querySelectorAll('[data-action="view-proof"]').forEach(btn => {
      btn.onclick = async () => {
        try{
          const res = await fetch(`${API_BASE}/api/v1/admin/deposits/${btn.dataset.id}/proof`, { headers: { 'Authorization': `Bearer ${state.token}` } });
          if(!res.ok) throw new Error('Impossible de charger la preuve');
          const blob = await res.blob();
          window.open(URL.createObjectURL(blob), '_blank');
        }catch(err){ toast(`Erreur : ${err.message}`); }
      };
    });
    el.querySelectorAll('[data-action="approve"]').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Approuver ce dépôt et créditer le wallet ?')) return;
        try {
          await apiFetch(`/api/v1/admin/deposits/${btn.dataset.id}/approve`, { method: 'POST' });
          toast('Dépôt approuvé, wallet crédité ✅');
          renderDeposits();
        } catch (err) { toast(`Erreur : ${err.message}`); }
      };
    });
    el.querySelectorAll('[data-action="reject"]').forEach(btn => {
      btn.onclick = async () => {
        const reason = prompt('Raison du rejet (optionnel) :', '');
        try {
          await apiFetch(`/api/v1/admin/deposits/${btn.dataset.id}/reject`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ reason }),
          });
          toast('Dépôt rejeté');
          renderDeposits();
        } catch (err) { toast(`Erreur : ${err.message}`); }
      };
    });
  } catch (err) {
    el.innerHTML = `<div class="topbar"><h1>Dépôts</h1></div><div class="empty-state">Erreur : ${err.message}</div>`;
  }
}

async function renderAlerts(){
  const el = document.getElementById('main-content');
  el.innerHTML = `<div class="topbar"><h1>Alertes système</h1></div><div class="empty-state">Chargement…</div>`;
  try {
    const alerts = await apiFetch('/api/v1/admin/alerts');
    state.alerts = alerts;
    el.innerHTML = `
      <div class="topbar"><div><h1>Alertes système</h1><p>Échecs automatiques (téléchargement TikTok, RapidAPI, etc.)</p></div></div>
      <div class="card">
        <table>
          <thead><tr><th>Type</th><th>Message</th><th>Date</th><th>Action</th></tr></thead>
          <tbody>
            ${alerts.map(a => `
              <tr>
                <td class="mono" style="font-size:11px;">${a.kind}</td>
                <td>${a.message}</td>
                <td class="mono" style="font-size:11px;">${new Date(a.created_at).toLocaleString('fr-FR')}</td>
                <td><button class="btn btn-sm" data-action="resolve" data-id="${a.id}">Marquer résolu</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${alerts.length===0 ? '<div class="empty-state">Aucune alerte active 🎉</div>' : ''}
      </div>
    `;
    el.querySelectorAll('[data-action="resolve"]').forEach(btn => {
      btn.onclick = async () => {
        try {
          await apiFetch(`/api/v1/admin/alerts/${btn.dataset.id}/resolve`, { method: 'POST' });
          toast('Alerte résolue');
          renderAlerts();
        } catch (err) { toast(`Erreur : ${err.message}`); }
      };
    });
  } catch (err) {
    el.innerHTML = `<div class="topbar"><h1>Alertes</h1></div><div class="empty-state">Erreur : ${err.message}</div>`;
  }
}

function render(){
  if (!state.token) { renderLogin(); return; }
  document.getElementById('app').innerHTML = renderShell();
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.onclick = () => go(btn.dataset.route);
  });
  if (state.route === 'overview') renderOverview();
  else if (state.route === 'users') renderUsers();
  else if (state.route === 'deposits') renderDeposits();
  else if (state.route === 'alerts') renderAlerts();
}

render();
</script>
</body>
</html>
